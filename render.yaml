# Render Blueprint Specification for Fertilizer Shop Management System
# Full-Stack Monorepo: Express REST API (Node.js) + React SPA (Vite) + PostgreSQL

services:
  # ============================================================================
  # 1. Express Backend Web Service
  # ============================================================================
  - type: web
    name: fertilizer-backend
    runtime: node
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: npm install
    startCommand: (node src/database/migrate.js --apply || true) && node src/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "5000"
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_ORIGIN
        value: "*"
      - key: DATABASE_URL
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false

  # ============================================================================
  # 2. React Vite Frontend Static Site
  # ============================================================================
  - type: web
    name: fertilizer-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
