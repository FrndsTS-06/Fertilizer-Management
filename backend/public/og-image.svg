<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1F3A" />
      <stop offset="60%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Ambient Light Orbs -->
  <circle cx="200" cy="150" r="250" fill="#059669" opacity="0.18" filter="url(#glow)" />
  <circle cx="1050" cy="480" r="300" fill="#2563EB" opacity="0.15" filter="url(#glow)" />

  <!-- Grid Overlay lines -->
  <path d="M0 100 H1200 M0 200 H1200 M0 300 H1200 M0 400 H1200 M0 500 H1200" stroke="#334155" stroke-opacity="0.15" stroke-width="1" />
  <path d="M150 0 V630 M300 0 V630 M450 0 V630 M600 0 V630 M750 0 V630 M900 0 V630 M1050 0 V630" stroke="#334155" stroke-opacity="0.15" stroke-width="1" />

  <!-- Main Card Container -->
  <rect x="90" y="80" width="1020" height="470" rx="24" fill="url(#cardGrad)" stroke="#334155" stroke-width="2" />

  <!-- Logo Badge -->
  <g transform="translate(150, 140)">
    <rect width="76" height="76" rx="20" fill="url(#primaryGrad)" />
    <!-- Leaf / Sprout Icon -->
    <path d="M38 56 V 32" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
    <path d="M38 40 C 46 40, 56 32, 56 22 C 46 22, 38 30, 38 40 Z" fill="#D1FAE5" />
    <path d="M38 44 C 30 44, 20 36, 20 26 C 30 26, 38 34, 38 44 Z" fill="#A7F3D0" />
    <circle cx="38" cy="20" r="3.5" fill="#FDE047" />
  </g>

  <!-- Brand Title -->
  <text x="250" y="175" fill="#10B981" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" letter-spacing="3">AGRI-INPUT ERP &amp; POS</text>
  <text x="250" y="210" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" letter-spacing="-1">Fertilizer Shop Management</text>

  <!-- Tagline / Description -->
  <text x="150" y="285" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="500">
    All-in-One Point of Sale, Batch Inventory &amp; Farmer Credit Ledger
  </text>

  <!-- Feature Pills -->
  <g transform="translate(150, 340)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="200" height="52" rx="12" fill="#1E293B" stroke="#059669" stroke-width="1.5" />
    <text x="25" y="32" fill="#6EE7B7" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700">🌾 POS Retail Billing</text>

    <!-- Pill 2 -->
    <rect x="220" y="0" width="220" height="52" rx="12" fill="#1E293B" stroke="#2563EB" stroke-width="1.5" />
    <text x="245" y="32" fill="#93C5FD" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700">📦 Batch &amp; Stock Expiry</text>

    <!-- Pill 3 -->
    <rect x="460" y="0" width="210" height="52" rx="12" fill="#1E293B" stroke="#06B6D4" stroke-width="1.5" />
    <text x="485" y="32" fill="#67E8F9" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700">📖 Farmer Khata Book</text>

    <!-- Pill 4 -->
    <rect x="690" y="0" width="190" height="52" rx="12" fill="#1E293B" stroke="#F59E0B" stroke-width="1.5" />
    <text x="715" y="32" fill="#FCD34D" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700">📊 GST Reports</text>
  </g>

  <!-- Bottom Bar Badge -->
  <g transform="translate(150, 460)">
    <rect x="0" y="0" width="880" height="42" rx="8" fill="#0B132B" stroke="#334155" stroke-width="1" />
    <circle cx="24" cy="21" r="6" fill="#10B981" />
    <text x="42" y="27" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600">Enterprise High-Performance • Offline-Ready POS • 100% Secure &amp; Compliant</text>
  </g>
</svg>
